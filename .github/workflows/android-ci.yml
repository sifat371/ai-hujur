name: Android quality checks
on:
  push:
    branches: [main, 'fix/**']
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # GitHub Ubuntu runners already provide Android command-line tools.
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check debug build and unit tests
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest
